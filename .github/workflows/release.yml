name: Publier le démarreur

# Se lance quand tu crées un tag (ex. v1.0.0) ou à la main depuis l'onglet Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test

      - name: Compiler (Native AOT)
        run: dotnet publish src/Felix.Bootstrap/Felix.Bootstrap.csproj -c Release -r win-x64 -o publish

      - name: Renommer pour les joueurs
        shell: pwsh
        run: Copy-Item publish/FelixBootstrap.exe publish/FelixLauncher-Setup.exe

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'bootstrap-latest' }}
          name: Démarreur Felix Launcher
          body: |
            **Joueurs : télécharge `FelixLauncher-Setup.exe` et lance-le.**
            Il installe et met à jour tout seul le Felix Launcher.
          files: publish/FelixLauncher-Setup.exe
